name: Company Newsroom Tracker

on:
  schedule:
    # Weekly, Sundays 22:00 UTC (offset from the tech-news scraper)
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Deep backfill to 2023 (instead of incremental)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape-companies:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run company pipeline
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python company_pipeline.py --backfill --max 200
          else
            python company_pipeline.py
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add company_news.json company_analysis.json company_news_tr.json
          if git diff --staged --quiet; then
            echo "No company-news changes to commit."
          else
            git commit -m "Automated company newsroom update [skip ci]"
            git push
          fi
