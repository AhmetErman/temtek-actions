name: Scheduled News Scraper

on:
  schedule:
    # Runs at 21:00 UTC every 2 days. Note: cron */2 counts day-of-month, so it
    # resets on the 1st - the gap across a month boundary can be a single day.
    - cron: '0 21 */2 * *'
  # Allows you to run this workflow manually from the Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Scraper and Classifier
        env:
          # Pulls the API key from your GitHub repository secrets
          GEMINI_API: ${{ secrets.GEMINI_API }}
          # Ensure Python output streams in real-time (no buffering)
          PYTHONUNBUFFERED: '1'
        run: python scraper_w_filter.py
        
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Stage the data files (classified news + the dynamic "Other" sub-taxonomy)
          git add tech_news_classified.json dynamic_classes.json
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new articles found. Nothing to commit."
          else
            git commit -m "Automated news scrape and classification [skip ci]"
            git push
          fi
