<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company News — Appliance Tracker</title>
    <meta name="description" content="Home-appliance company newsroom tracker (since 2023).">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #fafaf9; --surface: #ffffff; --border: #e7e5e4; --border-hover: #d6d3d1;
            --text-1: #1c1917; --text-2: #57534e; --text-3: #a8a29e;
            --accent: #2563eb; --accent-bg: #eff6ff; --accent-border: #bfdbfe;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --radius: 10px;
        }
        body.dark-theme {
            --bg: #0c0a09; --surface: #1c1917; --border: #2e2a24; --border-hover: #44403c;
            --text-1: #f5f5f4; --text-2: #d6d3d1; --text-3: #78716c;
            --accent: #60a5fa; --accent-bg: #172554; --accent-border: #1e40af;
        }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text-1); line-height: 1.5; min-height: 100vh;
            transition: background .2s, color .2s;
        }
        .site-header { border-bottom: 1px solid var(--border); background: var(--surface); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .logo { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; }
        .logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
        .nav { display: flex; gap: .25rem; }
        .nav a { font-size: .85rem; font-weight: 600; color: var(--text-2); text-decoration: none; padding: .4rem .8rem; border-radius: 8px; }
        .nav a:hover { background: var(--border); color: var(--text-1); }
        .nav a.active { background: var(--text-1); color: var(--bg); }
        .header-controls { display: flex; align-items: center; gap: 1rem; }
        .theme-toggle { background: none; border: 1px solid var(--border); color: var(--text-2); padding: .4rem .75rem; border-radius: 8px; cursor: pointer; font-size: .85rem; display: flex; gap: .4rem; align-items: center; }
        .theme-toggle:hover { background: var(--border); color: var(--text-1); }

        .wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
        .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: .25rem; }
        .page-sub { color: var(--text-3); font-size: .9rem; margin-bottom: 1.5rem; }

        .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; }
        .stat-card .num { font-size: 1.6rem; font-weight: 700; }
        .stat-card .lbl { font-size: .78rem; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }

        .toolbar { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
        .search-box { flex: 1; min-width: 200px; position: relative; }
        .search-box input { width: 100%; padding: .55rem .75rem .55rem 2.1rem; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: .875rem; background: var(--surface); color: var(--text-1); }
        .search-box input:focus { outline: none; border-color: var(--accent); }
        .search-box::before { content: '⌕'; position: absolute; left: .7rem; top: 50%; transform: translateY(-50%); color: var(--text-3); }
        .toolbar select { padding: .55rem .75rem; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: .85rem; background: var(--surface); color: var(--text-1); cursor: pointer; }

        .chips { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
        .chip { padding: .35rem .8rem; border: 1px solid var(--border); border-radius: 20px; font: inherit; font-size: .8rem; font-weight: 500; cursor: pointer; background: var(--surface); color: var(--text-2); display: flex; gap: .4rem; align-items: center; }
        .chip:hover { border-color: var(--border-hover); }
        .chip.active { background: var(--text-1); color: var(--bg); border-color: var(--text-1); }
        .chip .dot { width: 9px; height: 9px; border-radius: 50%; }

        .feed { display: flex; flex-direction: column; gap: .75rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; display: grid; grid-template-columns: 1fr auto; gap: 1rem; transition: border-color .12s; }
        .card:hover { border-color: var(--border-hover); }
        .card-main { min-width: 0; }
        .card-meta { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .35rem; }
        .badge { font-size: .68rem; font-weight: 700; padding: .15rem .55rem; border-radius: 5px; color: #fff; white-space: nowrap; }
        .card-date { font-size: .75rem; color: var(--text-3); }
        .card-title { font-size: .98rem; font-weight: 600; line-height: 1.4; }
        .card-title a { color: var(--text-1); text-decoration: none; }
        .card-title a:hover { color: var(--accent); }
        .card-sum { font-size: .85rem; color: var(--text-2); margin-top: .3rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-themes { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .5rem; }
        .ttag { font-size: .68rem; padding: .1rem .45rem; border-radius: 4px; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
        .thumb { width: 110px; height: 74px; object-fit: cover; border-radius: 8px; background: var(--border); flex-shrink: 0; }
        @media (max-width: 640px) { .wrap { padding: 1rem; } .thumb { display: none; } .card { grid-template-columns: 1fr; } }

        .loading, .empty { text-align: center; padding: 3rem; color: var(--text-3); }
        .spinner { width: 26px; height: 26px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result-count { font-size: .8rem; color: var(--text-3); margin-bottom: .75rem; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="logo"><div class="logo-icon">C</div> Company News</div>
            <nav class="nav">
                <a href="/">Tech News</a>
                <a href="/companies" class="active">Company News</a>
                <a href="/products">Products</a>
            </nav>
            <div class="header-controls">
                <button class="theme-toggle" id="themeToggle"><span id="themeIcon">☀️</span><span id="themeText">Light</span></button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <div class="page-title">Company News</div>
        <div class="page-sub" id="pageSub">Press releases from top home-appliance companies.</div>

        <div id="loading" class="loading"><div class="spinner"></div>Loading company data…</div>

        <div id="content" style="display:none;">
            <div class="stat-row" id="statRow"></div>

            <div class="toolbar">
                <div class="search-box"><input type="text" id="search" placeholder="Search releases…"></div>
                <select id="themeFilter"><option value="All">All themes</option></select>
                <select id="sortOrder"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select>
            </div>
            <div class="chips" id="companyChips"></div>

            <div class="result-count" id="resultCount"></div>
            <div class="feed" id="feed"></div>
        </div>
    </main>

    <script>
        const PALETTE = ['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#0d9488'];
        let NEWS = [], ANALYSIS = {}, COLOR = {};
        let curCompany = 'All', curTheme = 'All', curSearch = '', curSort = 'newest';

        function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) document.body.classList.add('dark-theme');
            syncThemeBtn();
        }
        function syncThemeBtn() {
            const dark = document.body.classList.contains('dark-theme');
            document.getElementById('themeIcon').textContent = dark ? '🌙' : '☀️';
            document.getElementById('themeText').textContent = dark ? 'Dark' : 'Light';
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
            syncThemeBtn();
        });

        function fmtDate(s){ if(!s) return ''; const d=new Date(s); return isNaN(d)?s:d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }

        async function init() {
            initTheme();
            try {
                const [n, a] = await Promise.all([
                    fetch('/api/company-news').then(r=>r.json()),
                    fetch('/api/company-analysis').then(r=>r.json())
                ]);
                NEWS = Array.isArray(n) ? n : [];
                ANALYSIS = a || {};
                (ANALYSIS.companies||[]).forEach((c,i)=> COLOR[c]=PALETTE[i%PALETTE.length]);
                document.getElementById('loading').style.display='none';
                if (!NEWS.length) { document.getElementById('content').innerHTML='<div class="empty">No company data yet. Run the company pipeline.</div>'; document.getElementById('content').style.display='block'; return; }
                document.getElementById('content').style.display='block';
                buildStats(); buildControls(); render();
            } catch(e) {
                document.getElementById('loading').innerHTML='Error: '+e.message;
            }
        }

        function buildStats() {
            const comps = ANALYSIS.companies||[];
            let earliest='9999', latest='0';
            Object.values(ANALYSIS.date_range||{}).forEach(r=>{ if(r.earliest<earliest)earliest=r.earliest; if(r.latest>latest)latest=r.latest; });
            const el = document.getElementById('statRow');
            el.innerHTML = `
                <div class="stat-card"><div class="num">${ANALYSIS.total_articles||NEWS.length}</div><div class="lbl">Releases</div></div>
                <div class="stat-card"><div class="num">${comps.length}</div><div class="lbl">Companies</div></div>
                <div class="stat-card"><div class="num">${(ANALYSIS.quarters||[]).length}</div><div class="lbl">Quarters</div></div>
                <div class="stat-card"><div class="num">${fmtDate(earliest)} – ${fmtDate(latest)}</div><div class="lbl">Coverage</div></div>`;
        }

        function buildControls() {
            const chips = document.getElementById('companyChips');
            const comps = ANALYSIS.companies||[];
            let html = `<button class="chip active" data-c="All" onclick="selCompany(this)">All</button>`;
            comps.forEach(c => { html += `<button class="chip" data-c="${c}" onclick="selCompany(this)"><span class="dot" style="background:${COLOR[c]}"></span>${c}</button>`; });
            chips.innerHTML = html;
            const tf = document.getElementById('themeFilter');
            (ANALYSIS.themes||[]).forEach(t => { const o=document.createElement('option'); o.value=t; o.textContent=t; tf.appendChild(o); });
            document.getElementById('search').addEventListener('input', e=>{ curSearch=e.target.value.trim().toLowerCase(); render(); });
            tf.addEventListener('change', e=>{ curTheme=e.target.value; render(); });
            document.getElementById('sortOrder').addEventListener('change', e=>{ curSort=e.target.value; render(); });
        }
        function selCompany(btn){ document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); curCompany=btn.dataset.c; render(); }

        function filtered() {
            let list = NEWS.slice();
            if (curCompany!=='All') list = list.filter(a=>a.company===curCompany);
            if (curTheme!=='All') list = list.filter(a=>(a.themes||[]).includes(curTheme));
            if (curSearch) list = list.filter(a=> (a.title||'').toLowerCase().includes(curSearch) || (a.summary||'').toLowerCase().includes(curSearch));
            list.sort((a,b)=> curSort==='newest' ? (b.date||'').localeCompare(a.date||'') : (a.date||'').localeCompare(b.date||''));
            return list;
        }

        function render() {
            const list = filtered();
            document.getElementById('resultCount').textContent = `${list.length} release${list.length!==1?'s':''}` + (curCompany!=='All'?` · ${curCompany}`:'') + (curTheme!=='All'?` · ${curTheme}`:'');
            const feed = document.getElementById('feed');
            if (!list.length) { feed.innerHTML='<div class="empty">No releases match your filters.</div>'; return; }
            feed.innerHTML = list.slice(0,300).map(a=>{
                const col = COLOR[a.company]||'#888';
                const themes = (a.themes||[]).filter(t=>t!=='Other').slice(0,4).map(t=>`<span class="ttag">${t}</span>`).join('');
                const thumb = a.image ? `<img class="thumb" src="${a.image}" loading="lazy" onerror="this.style.display='none'">` : '';
                return `<div class="card"><div class="card-main">
                    <div class="card-meta"><span class="badge" style="background:${col}">${a.company}</span><span class="card-date">${fmtDate(a.date)}</span></div>
                    <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${a.title||'Untitled'}</a></div>
                    ${a.summary?`<div class="card-sum">${a.summary}</div>`:''}
                    ${themes?`<div class="card-themes">${themes}</div>`:''}
                </div>${thumb}</div>`;
            }).join('');
        }

        init();
    </script>
</body>
</html>
