<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News Tracker</title>
    <meta name="description" content="AI-classified R&D and technology news from Japan and global tech sources.">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #fafaf9;
            --surface: #ffffff;
            --border: #e7e5e4;
            --border-hover: #d6d3d1;
            --text-1: #1c1917;
            --text-2: #57534e;
            --text-3: #a8a29e;
            --accent: #b45309;
            --accent-bg: #fffbeb;
            --accent-border: #fde68a;
            --tag-ai: #dbeafe;
            --tag-ai-text: #1e40af;
            --tag-sustain: #dcfce7;
            --tag-sustain-text: #166534;
            --tag-fabric: #fce7f3;
            --tag-fabric-text: #9d174d;
            --tag-chem: #e0e7ff;
            --tag-chem-text: #3730a3;
            --tag-hygiene: #fef3c7;
            --tag-hygiene-text: #92400e;
            --tag-other: #f5f5f4;
            --tag-other-text: #78716c;
            --tag-na: #f5f5f4;
            --tag-na-text: #a8a29e;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --radius: 10px;
        }

        body.dark-theme {
            --bg: #0c0a09;
            --surface: #1c1917;
            --border: #2e2a24;
            --border-hover: #44403c;
            --text-1: #f5f5f4;
            --text-2: #d6d3d1;
            --text-3: #78716c;
            --accent: #f59e0b;
            --accent-bg: #451a03;
            --accent-border: #78350f;
            --tag-ai: #1e3a8a;
            --tag-ai-text: #93c5fd;
            --tag-sustain: #064e3b;
            --tag-sustain-text: #6ee7b7;
            --tag-fabric: #831843;
            --tag-fabric-text: #fbcfe8;
            --tag-chem: #312e81;
            --tag-chem-text: #c7d2fe;
            --tag-hygiene: #78350f;
            --tag-hygiene-text: #fde68a;
            --tag-other: #27272a;
            --tag-other-text: #a1a1aa;
            --tag-na: #27272a;
            --tag-na-text: #71717a;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background: var(--bg);
            color: var(--text-1);
            line-height: 1.5;
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }

        /* --- HEADER --- */
        .site-header {
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }
        .header-stats {
            font-size: 0.8rem;
            color: var(--text-3);
            display: flex;
            gap: 1rem;
        }
        .header-stats span { white-space: nowrap; }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.15s;
        }
        .theme-toggle:hover {
            background: var(--border);
            color: var(--text-1);
        }

        /* --- SEARCH & TOOLBAR --- */
        .toolbar {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.25rem 2rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 0.6rem 0.75rem 0.6rem 2.25rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
            font-size: 0.875rem;
            background: var(--surface);
            color: var(--text-1);
            transition: border-color 0.15s;
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .search-box::before {
            content: '⌕';
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 1rem;
        }
        .toolbar select {
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
            font-size: 0.875rem;
            background: var(--surface);
            color: var(--text-1);
            cursor: pointer;
        }
        .toolbar select:focus { outline: none; border-color: var(--accent); }

        /* --- CATEGORY TABS --- */
        .tabs-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem 1rem;
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 0.4rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 20px;
            font: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--surface);
            color: var(--text-2);
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .tab-btn:hover { border-color: var(--border-hover); background: var(--border); }
        .tab-btn.active {
            background: var(--text-1);
            color: var(--bg);
            border-color: var(--text-1);
        }
        .tab-count {
            font-size: 0.7rem;
            background: rgba(120, 120, 120, 0.15);
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
        }

        /* --- NEWS LIST --- */
        .main-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem 3rem;
        }
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        /* --- NEWS ROW --- */
        .news-row {
            background: var(--surface);
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: start;
            padding: 0.85rem 1.25rem;
            gap: 1rem;
            transition: background 0.1s;
        }
        .news-row:hover { background: var(--bg); }

        .news-main {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            min-width: 0;
        }
        .news-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .news-tag {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }
        .tag-ai { background: var(--tag-ai); color: var(--tag-ai-text); }
        .tag-sustain { background: var(--tag-sustain); color: var(--tag-sustain-text); }
        .tag-fabric { background: var(--tag-fabric); color: var(--tag-fabric-text); }
        .tag-chem { background: var(--tag-chem); color: var(--tag-chem-text); }
        .tag-hygiene { background: var(--tag-hygiene); color: var(--tag-hygiene-text); }
        .tag-other { background: var(--tag-other); color: var(--tag-other-text); }
        .tag-na { background: var(--tag-na); color: var(--tag-na-text); }

        .news-source {
            font-size: 0.75rem;
            color: var(--text-3);
            font-weight: 500;
        }
        .news-date {
            font-size: 0.75rem;
            color: var(--text-3);
        }
        .meta-dot {
            width: 3px; height: 3px;
            border-radius: 50%;
            background: var(--text-3);
            flex-shrink: 0;
        }

        .new-badge {
            background: var(--accent);
            color: var(--bg);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .news-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
        }
        .news-title a {
            color: var(--text-1);
            text-decoration: none;
        }
        .news-title a:hover { color: var(--accent); }

        .news-gemini-summary {
            font-size: 0.8rem;
            color: var(--text-3);
            font-style: italic;
        }

        /* Expandable abstract */
        .news-expand-btn {
            font-size: 0.75rem;
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.15rem 0;
            font-family: inherit;
            font-weight: 500;
            text-align: left;
            align-self: flex-start;
        }
        .news-expand-btn:hover { text-decoration: underline; }
        .news-abstract {
            display: none;
            font-size: 0.85rem;
            color: var(--text-2);
            line-height: 1.6;
            padding: 0.5rem 0 0.25rem;
            border-top: 1px dashed var(--border);
            margin-top: 0.3rem;
        }
        .news-abstract.open { display: block; }

        .original-text-section {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: rgba(120, 120, 120, 0.05);
            border-radius: 6px;
            font-size: 0.8rem;
            border-left: 2px solid var(--border);
        }
        .original-title {
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 0.25rem;
        }
        .original-body {
            color: var(--text-3);
        }

        .news-side {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.25rem;
            flex-shrink: 0;
            padding-top: 0.1rem;
        }
        .news-score-dots {
            display: flex;
            gap: 3px;
        }
        .score-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--border);
        }
        .score-dot.filled { background: var(--accent); }

        /* --- OTHERS COLLAPSIBLE SECTION --- */
        .others-section {
            margin-top: 1.5rem;
        }
        .others-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            cursor: pointer;
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-2);
            width: 100%;
            transition: background 0.15s;
        }
        .others-toggle:hover { background: var(--bg); }
        .others-toggle .chevron {
            transition: transform 0.2s;
            font-size: 0.7rem;
        }
        .others-toggle.open .chevron { transform: rotate(90deg); }
        .others-list {
            display: none;
            margin-top: 0.5rem;
        }
        .others-list.open { display: flex; flex-direction: column; }

        /* --- BACK TO TOP --- */
        .back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--text-1);
            color: var(--bg);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: var(--shadow-md);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 99;
        }
        .back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .back-to-top:hover {
            transform: translateY(-3px);
        }

        /* --- EMPTY & LOADING --- */
        .loading-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-3);
            font-size: 0.95rem;
        }
        .spinner {
            width: 28px; height: 28px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-3);
        }

        .result-count {
            font-size: 0.8rem;
            color: var(--text-3);
            padding: 0.5rem 0;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 640px) {
            .site-header { padding: 1rem; }
            .toolbar { padding: 1rem; }
            .tabs-wrapper { padding: 0 1rem 0.75rem; }
            .main-content { padding: 0 1rem 2rem; }
            .news-row { grid-template-columns: 1fr; padding: 0.75rem 1rem; }
            .news-side { flex-direction: row; align-items: center; gap: 0.75rem; }
            .header-stats { display: none; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">T</div>
                Tech News Tracker
            </div>
            <nav style="display:flex;gap:.25rem;">
                <a href="/" style="font-size:.85rem;font-weight:600;color:var(--bg);background:var(--text-1);text-decoration:none;padding:.4rem .8rem;border-radius:8px;">Tech News</a>
                <a href="/companies" style="font-size:.85rem;font-weight:600;color:var(--text-2);text-decoration:none;padding:.4rem .8rem;border-radius:8px;">Companies</a>
            </nav>
            <div class="header-controls">
                <div class="header-stats" id="headerStats"></div>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <span id="themeToggleIcon">☀️</span>
                    <span id="themeToggleText">Light</span>
                </button>
            </div>
        </div>
    </header>

    <div class="toolbar" id="toolbar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search news... (press '/' to focus)" />
        </div>
        <select id="sourceFilter">
            <option value="All">All sources</option>
        </select>
        <select id="dateFilter">
            <option value="All">Any time</option>
            <option value="today">Past 24 hours</option>
            <option value="week">Past week</option>
            <option value="month">Past month</option>
        </select>
        <select id="sortOrder">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="score-high">Relevance ↓</option>
            <option value="score-low">Relevance ↑</option>
        </select>
    </div>

    <div class="tabs-wrapper" id="tabs"></div>

    <main class="main-content">
        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            Loading news...
        </div>
        <div id="resultCount" class="result-count" style="display:none;"></div>
        <div id="newsList"></div>
        <div id="othersSection" class="others-section" style="display:none;"></div>
    </main>

    <button class="back-to-top" id="backToTop" title="Back to top" aria-label="Back to top">↑</button>

    <script>
        let allNews = [];
        let currentCategory = 'All';
        let currentSearch = '';
        let currentSource = 'All';
        let currentSort = 'newest';
        let currentDateFilter = 'All';
        let latestNewsTime = 0;

        const TAG_MAP = {
            'AI, IoT & Smart Sensors': 'tag-ai',
            'Sustainability & Environmental Impact': 'tag-sustain',
            'Fabric Care & Textile Engineering': 'tag-fabric',
            'Chemical Interaction & Smart Dosing': 'tag-chem',
            'Hygiene & Health Technologies': 'tag-hygiene',
            'Other': 'tag-other',
            'N/A': 'tag-na',
            'Uncategorized': 'tag-na'
        };

        const SHORT_NAMES = {
            'AI, IoT & Smart Sensors': 'AI & IoT',
            'Sustainability & Environmental Impact': 'Sustainability',
            'Fabric Care & Textile Engineering': 'Fabric Care',
            'Chemical Interaction & Smart Dosing': 'Smart Dosing',
            'Hygiene & Health Technologies': 'Hygiene'
        };

        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark-theme');
                document.getElementById('themeToggleIcon').textContent = '🌙';
                document.getElementById('themeToggleText').textContent = 'Dark';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const body = document.body;
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeToggleIcon').textContent = isDark ? '🌙' : '☀️';
            document.getElementById('themeToggleText').textContent = isDark ? 'Dark' : 'Light';
        });

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const d = new Date(dateStr);
            return isNaN(d) ? null : d;
        }

        function formatDate(dateStr) {
            const d = parseDate(dateStr);
            if (!d) return dateStr || '';
            const now = new Date();
            const diff = now - d;
            const days = Math.floor(diff / 86400000);
            if (days === 0) return 'Today';
            if (days === 1) return 'Yesterday';
            if (days < 7) return days + 'd ago';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function getTagClass(cat) {
            return TAG_MAP[cat] || 'tag-other';
        }

        function getShortName(cat) {
            return SHORT_NAMES[cat] || cat;
        }

        function toggleAbstract(id) {
            const el = document.getElementById('abs-' + id);
            const btn = document.getElementById('btn-' + id);
            if (el.classList.contains('open')) {
                el.classList.remove('open');
                btn.textContent = 'Show details ▸';
            } else {
                el.classList.add('open');
                btn.textContent = 'Hide details ▾';
            }
        }

        function buildRow(item, index) {
            const title = item.title_en || item.title || 'Untitled';
            const summary = item.summary_en || item.summary || '';
            const cat = item.Classification || 'Uncategorized';
            const dateStr = formatDate(item.date);
            const geminiSummary = item.Gemini_Summary && item.Gemini_Summary !== 'N/A' ? item.Gemini_Summary : '';
            const score = item.RelationScore || 0;
            const uid = 'n' + index;

            const itemTime = parseDate(item.date);
            const isNew = itemTime && (latestNewsTime - itemTime.getTime() < 3600000 * 24); // Within 24 hours of latest scrape

            let dots = '';
            for (let i = 1; i <= 5; i++) {
                dots += `<div class="score-dot ${i <= score ? 'filled' : ''}"></div>`;
            }

            let detailsHTML = '';
            if ((summary && summary.length > 10) || item.title) {
                detailsHTML = `
                    <button class="news-expand-btn" id="btn-${uid}" onclick="toggleAbstract('${uid}')">Show details ▸</button>
                    <div class="news-abstract" id="abs-${uid}">
                        ${summary ? `<p>${summary}</p>` : ''}
                        <div class="original-text-section">
                            <div class="original-title">🇯🇵 Original Title: ${item.title || 'Untitled'}</div>
                            ${item.summary ? `<div class="original-body">${item.summary}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            return `<div class="news-row">
                <div class="news-main">
                    <div class="news-meta">
                        <span class="news-tag ${getTagClass(cat)}">${getShortName(cat)}</span>
                        <span class="news-source">${item.source || ''}</span>
                        <span class="meta-dot"></span>
                        <span class="news-date">${dateStr}</span>
                        ${isNew ? `<span class="new-badge">New</span>` : ''}
                    </div>
                    <div class="news-title">
                        <a href="${item.url || '#'}" target="_blank" rel="noopener noreferrer">${title}</a>
                    </div>
                    ${geminiSummary ? `<div class="news-gemini-summary">${geminiSummary}</div>` : ''}
                    ${detailsHTML}
                </div>
                <div class="news-side">
                    <div class="news-score-dots">${dots}</div>
                </div>
            </div>`;
        }

        function getFilteredNews() {
            let list = [...allNews];

            // Search
            if (currentSearch) {
                const q = currentSearch.toLowerCase();
                list = list.filter(item => {
                    const t = (item.title_en || item.title || '').toLowerCase();
                    const s = (item.summary_en || item.summary || '').toLowerCase();
                    const g = (item.Gemini_Summary || '').toLowerCase();
                    return t.includes(q) || s.includes(q) || g.includes(q);
                });
            }

            // Source Filter
            if (currentSource !== 'All') {
                list = list.filter(item => item.source === currentSource);
            }

            // Date Filter
            if (currentDateFilter !== 'All') {
                const now = new Date().getTime();
                list = list.filter(item => {
                    const itemTime = parseDate(item.date);
                    if (!itemTime) return false;
                    const diff = now - itemTime.getTime();
                    if (currentDateFilter === 'today') return diff < 86400000;
                    if (currentDateFilter === 'week') return diff < 86400000 * 7;
                    if (currentDateFilter === 'month') return diff < 86400000 * 30;
                    return true;
                });
            }

            // Sort
            list.sort((a, b) => {
                if (currentSort === 'newest') return (parseDate(b.date) || 0) - (parseDate(a.date) || 0);
                if (currentSort === 'oldest') return (parseDate(a.date) || 0) - (parseDate(b.date) || 0);
                if (currentSort === 'score-high') return (b.RelationScore || 0) - (a.RelationScore || 0);
                if (currentSort === 'score-low') return (a.RelationScore || 0) - (b.RelationScore || 0);
                return 0;
            });

            return list;
        }

        function render() {
            const filtered = getFilteredNews();
            const listEl = document.getElementById('newsList');
            const othersEl = document.getElementById('othersSection');
            const countEl = document.getElementById('resultCount');

            let mainNews, otherNews;

            if (currentCategory === 'All') {
                mainNews = filtered.filter(i => i.Classification && i.Classification !== 'Other' && i.Classification !== 'N/A');
                otherNews = filtered.filter(i => !i.Classification || i.Classification === 'Other' || i.Classification === 'N/A');
            } else if (currentCategory === 'Other') {
                mainNews = filtered.filter(i => !i.Classification || i.Classification === 'Other' || i.Classification === 'N/A');
                otherNews = [];
            } else {
                mainNews = filtered.filter(i => i.Classification === currentCategory);
                otherNews = [];
            }

            countEl.style.display = 'block';
            const total = mainNews.length + otherNews.length;
            countEl.textContent = `${total} article${total !== 1 ? 's' : ''}` +
                (currentSearch ? ` matching "${currentSearch}"` : '') +
                (currentCategory !== 'All' ? ` in ${getShortName(currentCategory)}` : '');

            if (mainNews.length > 0) {
                listEl.innerHTML = `<div class="news-list">${mainNews.map((item, i) => buildRow(item, i)).join('')}</div>`;
            } else if (otherNews.length === 0) {
                listEl.innerHTML = `<div class="empty-state">No articles found.</div>`;
            } else {
                listEl.innerHTML = '';
            }

            if (otherNews.length > 0 && currentCategory === 'All') {
                othersEl.style.display = 'block';
                othersEl.innerHTML = `
                    <button class="others-toggle" onclick="toggleOthers(this)">
                        <span class="chevron">▸</span>
                        Other & Uncategorized (${otherNews.length} articles)
                    </button>
                    <div class="others-list">
                        <div class="news-list">${otherNews.map((item, i) => buildRow(item, mainNews.length + i)).join('')}</div>
                    </div>
                `;
            } else {
                othersEl.style.display = 'none';
            }
        }

        function toggleOthers(btn) {
            btn.classList.toggle('open');
            const list = btn.nextElementSibling;
            list.classList.toggle('open');
        }

        function setupUI() {
            const cats = {};
            allNews.forEach(item => {
                const c = item.Classification || 'N/A';
                cats[c] = (cats[c] || 0) + 1;
            });

            const tabsEl = document.getElementById('tabs');
            const mainCats = Object.keys(cats).filter(c => c !== 'Other' && c !== 'N/A').sort();
            const otherCount = (cats['Other'] || 0) + (cats['N/A'] || 0);

            let tabsHTML = `<button class="tab-btn active" data-cat="All" onclick="selectTab(this)">All <span class="tab-count">${allNews.length}</span></button>`;
            mainCats.forEach(cat => {
                tabsHTML += `<button class="tab-btn" data-cat="${cat}" onclick="selectTab(this)">${getShortName(cat)} <span class="tab-count">${cats[cat]}</span></button>`;
            });
            if (otherCount > 0) {
                tabsHTML += `<button class="tab-btn" data-cat="Other" onclick="selectTab(this)">Other <span class="tab-count">${otherCount}</span></button>`;
            }
            tabsEl.innerHTML = tabsHTML;

            const sources = [...new Set(allNews.map(i => i.source).filter(Boolean))].sort();
            const sourceEl = document.getElementById('sourceFilter');
            sources.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                sourceEl.appendChild(opt);
            });

            const newest = allNews.reduce((best, i) => {
                const d = parseDate(i.date);
                return d && (!best || d > best) ? d : best;
            }, null);
            if (newest) latestNewsTime = newest.getTime();

            const statsEl = document.getElementById('headerStats');
            statsEl.innerHTML = `
                <span>${allNews.length} articles</span>
                <span>${sources.length} sources</span>
                ${newest ? `<span>Latest: ${newest.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>` : ''}
            `;
        }

        function selectTab(btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = btn.dataset.cat;
            render();
        }

        // Back to Top Button
        const backToTopBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });
        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
                e.preventDefault();
                const search = document.getElementById('searchInput');
                search.focus();
                search.select();
            }
        });

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', function(e) {
            currentSearch = e.target.value.trim();
            render();
        });
        document.getElementById('sourceFilter').addEventListener('change', function(e) {
            currentSource = e.target.value;
            render();
        });
        document.getElementById('dateFilter').addEventListener('change', function(e) {
            currentDateFilter = e.target.value;
            render();
        });
        document.getElementById('sortOrder').addEventListener('change', function(e) {
            currentSort = e.target.value;
            render();
        });

        // Init
        async function init() {
            initTheme();
            try {
                const res = await fetch('/api/news');
                allNews = await res.json();
                document.getElementById('loading').style.display = 'none';

                if (allNews.length === 0) {
                    document.getElementById('newsList').innerHTML = '<div class="empty-state">No news yet. The scraper might not have run.</div>';
                    return;
                }

                allNews.sort((a, b) => (parseDate(b.date) || 0) - (parseDate(a.date) || 0));

                setupUI();
                render();
            } catch (err) {
                document.getElementById('loading').innerHTML = `Error: ${err.message}`;
            }
        }

        init();
    </script>
</body>
</html>
