<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="i18n-title" content="title.news">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tem&Tek Technology Tracker Agent</title>
    <meta name="description" content="AI-classified R&D and technology news from Far East countries and global tech sources.">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/i18n.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">T</div>
                <span data-i18n="site.title">Tem&Tek Technology Tracker Agent</span>
            </div>
            <nav style="display:flex;gap:.25rem;">
                <a href="/" style="font-size:.85rem;font-weight:600;color:var(--bg);background:var(--text-1);text-decoration:none;padding:.4rem .8rem;border-radius:8px;" data-i18n="nav.news">Tech News</a>
                <a href="/companies" style="font-size:.85rem;font-weight:600;color:var(--text-2);text-decoration:none;padding:.4rem .8rem;border-radius:8px;" data-i18n="nav.companies">Company News</a>
                <a href="/products" style="font-size:.85rem;font-weight:600;color:var(--text-2);text-decoration:none;padding:.4rem .8rem;border-radius:8px;" data-i18n="nav.products">Products</a>
            </nav>
            <div class="header-controls">
                <button class="theme-toggle" id="langToggle" title="Switch language">TR</button>
                <button class="theme-toggle" id="themeToggle" data-i18n-aria="common.toggleTheme" aria-label="Toggle dark mode">
                    <span id="themeToggleIcon">☀️</span>
                    <span id="themeToggleText" data-i18n="theme.light">Light</span>
                </button>
            </div>
        </div>
    </header>

    <div class="toolbar" id="toolbar">
        <div class="search-box">
            <input type="text" id="searchInput" data-i18n-ph="news.search" placeholder="Search news... (press '/' to focus)" />
        </div>
        <select id="sourceFilter">
            <option value="All" data-i18n="filter.allSources">All sources</option>
        </select>
        <select id="dateFilter">
            <option value="All" data-i18n="filter.anyTime">Any time</option>
            <option value="today" data-i18n="filter.past24">Past 24 hours</option>
            <option value="week" data-i18n="filter.pastWeek">Past week</option>
            <option value="month" data-i18n="filter.pastMonth">Past month</option>
        </select>
        <select id="sortOrder">
            <option value="newest" data-i18n="sort.newest">Newest first</option>
            <option value="oldest" data-i18n="sort.oldest">Oldest first</option>
            <option value="score-high" data-i18n="sort.scoreHigh">Relevance ↓</option>
            <option value="score-low" data-i18n="sort.scoreLow">Relevance ↑</option>
        </select>
    </div>

    <div class="tabs-wrapper" id="tabs"></div>

    <main class="main-content">
        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            <span data-i18n="news.loading">Loading news...</span>
        </div>
        <div id="newsList"></div>
    </main>

    <footer class="page-footer" id="pageFooter"></footer>

    <button class="back-to-top" id="backToTop" data-i18n-title="common.backToTop" data-i18n-aria="common.backToTop" title="Back to top" aria-label="Back to top">↑</button>

    <script>
        let allNews = [];
        let currentCategory = 'All';
        let currentSearch = '';
        let currentSource = 'All';
        let currentSort = 'newest';
        let currentDateFilter = 'All';
        let latestNewsTime = 0;

        const TAG_MAP = {
            'AI, IoT & Smart Sensors': 'tag-ai',
            'Sustainability & Environmental Impact': 'tag-sustain',
            'Fabric Care & Textile Engineering': 'tag-fabric',
            'Chemical Interaction & Smart Dosing': 'tag-chem',
            'Hygiene & Health Technologies': 'tag-hygiene',
            'Other': 'tag-other',
            'N/A': 'tag-na',
            'Uncategorized': 'tag-na'
        };

        const SHORT_NAMES = {
            'AI, IoT & Smart Sensors': 'AI & IoT',
            'Sustainability & Environmental Impact': 'Sustainability',
            'Fabric Care & Textile Engineering': 'Fabric Care',
            'Chemical Interaction & Smart Dosing': 'Smart Dosing',
            'Hygiene & Health Technologies': 'Hygiene'
        };

        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark-theme');
                document.getElementById('themeToggleIcon').textContent = '🌙';
                document.getElementById('themeToggleText').textContent = t('theme.dark');
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const body = document.body;
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeToggleIcon').textContent = isDark ? '🌙' : '☀️';
            document.getElementById('themeToggleText').textContent = isDark ? t('theme.dark') : t('theme.light');
        });

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const d = new Date(dateStr);
            return isNaN(d) ? null : d;
        }

        function formatDate(dateStr) {
            const d = parseDate(dateStr);
            if (!d) return dateStr || '';
            const now = new Date();
            const diff = now - d;
            const days = Math.floor(diff / 86400000);
            if (days === 0) return t('common.today');
            if (days === 1) return t('common.yesterday');
            if (days < 7) return days + t('common.daysAgo');
            return d.toLocaleDateString(LANG === 'tr' ? 'tr-TR' : 'en-US', { month: 'short', day: 'numeric' });
        }

        function getTagClass(cat) {
            return TAG_MAP[cat] || 'tag-other';
        }

        function getShortName(cat) {
            return tShort(cat) !== cat ? tShort(cat) : (SHORT_NAMES[cat] || cat);
        }

        function toggleAbstract(id) {
            const el = document.getElementById('abs-' + id);
            const btn = document.getElementById('btn-' + id);
            if (el.classList.contains('open')) {
                el.classList.remove('open');
                btn.textContent = t('common.showDetails');
            } else {
                el.classList.add('open');
                btn.textContent = t('common.hideDetails');
            }
        }

        function buildRow(item, index) {
            const title = item.title_en || item.title || 'Untitled';
            const summary = item.summary_en || item.summary || '';
            const cat = item.Classification || 'Uncategorized';
            const tagLabel = (cat === 'Other' && item.OtherSubclass) ? item.OtherSubclass : getShortName(cat);
            const dateStr = formatDate(item.date);
            const geminiSummary = item.Gemini_Summary && item.Gemini_Summary !== 'N/A' ? item.Gemini_Summary : '';
            const uid = 'n' + index;

            const itemTime = parseDate(item.date);
            const isNew = itemTime && (latestNewsTime - itemTime.getTime() < 3600000 * 24); // Within 24 hours of latest scrape

            let detailsHTML = '';
            if ((summary && summary.length > 10) || item.title) {
                detailsHTML = `
                    <button class="news-expand-btn" id="btn-${uid}" onclick="toggleAbstract('${uid}')">${t('common.showDetails')}</button>
                    <div class="news-abstract" id="abs-${uid}">
                        ${summary ? `<p>${summary}</p>` : ''}
                        <div class="original-text-section">
                            <div class="original-title">🇯🇵 ${t('common.originalTitle')} ${item.title || ''}</div>
                            ${item.summary ? `<div class="original-body">${item.summary}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            return `<div class="news-row">
                <div class="news-main">
                    <div class="news-meta">
                        <span class="news-tag ${getTagClass(cat)}">${tagLabel}</span>
                        <span class="news-source">${item.source || ''}</span>
                        <span class="meta-dot"></span>
                        <span class="news-date">${dateStr}</span>
                        ${isNew ? `<span class="new-badge">${t('common.new')}</span>` : ''}
                    </div>
                    <div class="news-title">
                        <a href="${item.url || '#'}" target="_blank" rel="noopener noreferrer">${title}</a>
                    </div>
                    ${geminiSummary ? `<div class="news-gemini-summary">${geminiSummary}</div>` : ''}
                    ${detailsHTML}
                </div>
            </div>`;
        }

        function getFilteredNews() {
            let list = [...allNews];

            // Search
            if (currentSearch) {
                const q = currentSearch.toLowerCase();
                list = list.filter(item => {
                    const t = (item.title_en || item.title || '').toLowerCase();
                    const s = (item.summary_en || item.summary || '').toLowerCase();
                    const g = (item.Gemini_Summary || '').toLowerCase();
                    return t.includes(q) || s.includes(q) || g.includes(q);
                });
            }

            // Source Filter
            if (currentSource !== 'All') {
                list = list.filter(item => item.source === currentSource);
            }

            // Date Filter
            if (currentDateFilter !== 'All') {
                const now = new Date().getTime();
                list = list.filter(item => {
                    const itemTime = parseDate(item.date);
                    if (!itemTime) return false;
                    const diff = now - itemTime.getTime();
                    if (currentDateFilter === 'today') return diff < 86400000;
                    if (currentDateFilter === 'week') return diff < 86400000 * 7;
                    if (currentDateFilter === 'month') return diff < 86400000 * 30;
                    return true;
                });
            }

            // Sort
            list.sort((a, b) => {
                if (currentSort === 'newest') return (parseDate(b.date) || 0) - (parseDate(a.date) || 0);
                if (currentSort === 'oldest') return (parseDate(a.date) || 0) - (parseDate(b.date) || 0);
                if (currentSort === 'score-high') return (b.RelationScore || 0) - (a.RelationScore || 0);
                if (currentSort === 'score-low') return (a.RelationScore || 0) - (b.RelationScore || 0);
                return 0;
            });

            return list;
        }

        function render() {
            const filtered = getFilteredNews();
            const listEl = document.getElementById('newsList');

            // This page shows only topic-focused (non-Other) news. Off-topic
            // "Other" news lives on the separate "Beyond Our Focus" page.
            const mainNews = filtered.filter(i =>
                i.Classification && i.Classification !== 'Other' && i.Classification !== 'N/A' &&
                (currentCategory === 'All' || i.Classification === currentCategory));

            let rowId = 0;
            if (mainNews.length > 0) {
                listEl.innerHTML = `<div class="news-list">${mainNews.map(item => buildRow(item, rowId++)).join('')}</div>`;
            } else {
                listEl.innerHTML = `<div class="empty-state">${t('common.none')}</div>`;
            }
        }

        function toggleOthers(btn) {
            btn.classList.toggle('open');
            const list = btn.nextElementSibling;
            list.classList.toggle('open');
        }

        function toggleSub(btn) {
            btn.classList.toggle('open');
            btn.nextElementSibling.classList.toggle('open');
        }

        function setupUI() {
            const cats = new Set(allNews.map(item => item.Classification || 'N/A'));

            const tabsEl = document.getElementById('tabs');
            const mainCats = [...cats].filter(c => c !== 'Other' && c !== 'N/A').sort();

            let tabsHTML = `<button class="tab-btn active" data-cat="All" onclick="selectTab(this)">${t('common.all')}</button>`;
            mainCats.forEach(cat => {
                tabsHTML += `<button class="tab-btn" data-cat="${cat}" onclick="selectTab(this)">${getShortName(cat)}</button>`;
            });
            // No "Other" tab. Off-topic news lives on its own /beyond page,
            // reachable via this button at the end of the topic tabs.
            tabsHTML += `<a class="beyond-link" href="/beyond" title="${t('news.beyondHint')}">${t('news.beyondLink')}</a>`;
            tabsEl.innerHTML = tabsHTML;

            const sources = [...new Set(allNews.map(i => i.source).filter(Boolean))].sort();
            const sourceEl = document.getElementById('sourceFilter');
            sources.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                sourceEl.appendChild(opt);
            });

            const newest = allNews.reduce((best, i) => {
                const d = parseDate(i.date);
                return d && (!best || d > best) ? d : best;
            }, null);
            if (newest) latestNewsTime = newest.getTime();

            const statsEl = document.getElementById('pageFooter');
            const loc = LANG === 'tr' ? 'tr-TR' : 'en-US';
            statsEl.innerHTML = `
                <span>${allNews.length} ${LANG === 'tr' ? 'makale' : 'articles'}</span>
                <span>${sources.length} ${LANG === 'tr' ? 'kaynak' : 'sources'}</span>
                ${newest ? `<span>${LANG === 'tr' ? 'Son tarama' : 'Latest scrape'}: ${newest.toLocaleDateString(loc, { month: 'short', day: 'numeric' })}</span>` : ''}
            `;
        }

        function selectTab(btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = btn.dataset.cat;
            render();
        }

        // Back to Top Button
        const backToTopBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });
        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
                e.preventDefault();
                const search = document.getElementById('searchInput');
                search.focus();
                search.select();
            }
        });

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', function(e) {
            currentSearch = e.target.value.trim();
            render();
        });
        document.getElementById('sourceFilter').addEventListener('change', function(e) {
            currentSource = e.target.value;
            render();
        });
        document.getElementById('dateFilter').addEventListener('change', function(e) {
            currentDateFilter = e.target.value;
            render();
        });
        document.getElementById('sortOrder').addEventListener('change', function(e) {
            currentSort = e.target.value;
            render();
        });

        // Init
        async function loadNews() {
            const res = await fetch('/api/news' + langQuery());
            allNews = await res.json();
        }

        async function init() {
            initTheme();
            // Re-fetch on a language switch: article text is translated
            // server-side, so the same field names come back in Turkish.
            initLang(async () => {
                await loadNews();
                allNews.sort((a, b) => (parseDate(b.date) || 0) - (parseDate(a.date) || 0));
                setupUI();
                render();
            });
            try {
                await loadNews();
                document.getElementById('loading').style.display = 'none';

                if (allNews.length === 0) {
                    document.getElementById('newsList').innerHTML = `<div class="empty-state">${t('news.empty')}</div>`;
                    return;
                }

                allNews.sort((a, b) => (parseDate(b.date) || 0) - (parseDate(a.date) || 0));

                setupUI();
                render();
            } catch (err) {
                document.getElementById('loading').innerHTML = `Error: ${err.message}`;
            }
        }

        init();
    </script>
</body>
</html>
