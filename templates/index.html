<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --glass-blur: blur(16px);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeIn 1s ease-out;
        }

        .filter-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: var(--glass-blur);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            color: white;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .news-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.8rem;
            backdrop-filter: var(--glass-blur);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideUp 0.6s ease-out backwards;
            display: flex;
            flex-direction: column;
        }

        .news-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(40, 53, 75, 0.8);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.2rem;
        }

        .badge {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .date {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .title a {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .title a:hover {
            color: var(--accent-hover);
        }

        .summary {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.8rem;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.2rem;
            margin-top: auto;
        }

        .source {
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .source::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-color);
        }

        .score {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .star {
            color: #fbbf24;
            font-size: 1.1rem;
            text-shadow: 0 0 5px rgba(251, 191, 36, 0.5);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-secondary);
            padding: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Tech News Tracker</h1>
            <p class="subtitle">AI-Classified R&D and Technology Insights</p>
        </header>

        <div class="filters" id="filters">
            <!-- Filters will be injected here -->
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <span>Fetching latest insights...</span>
        </div>

        <div class="news-grid" id="newsGrid">
            <!-- News cards will be injected here -->
        </div>
    </div>

    <script>
        let allNews = [];
        const grid = document.getElementById('newsGrid');
        const loading = document.getElementById('loading');
        const filtersContainer = document.getElementById('filters');

        async function fetchNews() {
            try {
                const response = await fetch('/api/news');
                allNews = await response.json();
                loading.style.display = 'none';
                
                if (allNews.length === 0) {
                    grid.innerHTML = '<div class="loading">No news found. The scheduled scraper might not have run yet.</div>';
                    return;
                }

                setupFilters();
                renderNews('All');
            } catch (error) {
                loading.innerHTML = `Error loading news: ${error.message}`;
            }
        }

        function setupFilters() {
            const categories = new Set();
            allNews.forEach(item => {
                if (item.Classification && item.Classification !== 'N/A') {
                    categories.add(item.Classification);
                }
            });

            let filterHTML = `<button class="filter-btn active" onclick="setFilter('All', this)">All</button>`;
            Array.from(categories).sort().forEach(cat => {
                filterHTML += `<button class="filter-btn" onclick="setFilter('${cat}', this)">${cat}</button>`;
            });
            
            filtersContainer.innerHTML = filterHTML;
        }

        function setFilter(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            renderNews(category);
        }

        function renderNews(filterCategory) {
            grid.innerHTML = '';
            
            const filteredNews = filterCategory === 'All' 
                ? allNews 
                : allNews.filter(item => item.Classification === filterCategory);

            filteredNews.forEach((item, index) => {
                const title = item.title_en || item.title || 'Untitled';
                const summary = item.summary_en || item.summary || 'No summary available.';
                const category = item.Classification || 'Uncategorized';
                
                // Better date parsing
                let dateStr = item.date;
                try {
                    const parsedDate = new Date(item.date);
                    if (!isNaN(parsedDate)) {
                        dateStr = parsedDate.toLocaleDateString('en-US', { 
                            year: 'numeric', month: 'short', day: 'numeric' 
                        });
                    }
                } catch(e) {}
                
                let stars = '';
                if(item.RelationScore > 0) {
                    for(let i=0; i<item.RelationScore; i++) stars += '★';
                }

                const card = document.createElement('div');
                card.className = 'news-card';
                // Staggered animation
                card.style.animationDelay = `${Math.min(index * 0.05, 0.5)}s`;
                
                card.innerHTML = `
                    <div class="card-header">
                        <span class="badge">${category}</span>
                        <span class="date">${dateStr}</span>
                    </div>
                    <h2 class="title">
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer">${title}</a>
                    </h2>
                    <div class="summary">${summary}</div>
                    <div class="card-footer">
                        <span class="source">${item.source}</span>
                        <span class="score">Rel: <span class="star">${stars}</span></span>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            // Re-bind window functions
            window.setFilter = setFilter;
        }

        fetchNews();
    </script>
</body>
</html>
